# Portal Scanner Configuration
# Copy to portals.yml and customize.
#
# Companies with Greenhouse / Lever / Ashby / Workday board URLs are fetched by
# the watchlist + workday discovery adapters (fast JSON APIs).
# scan_method: playwright  → branded careers page (slower; not every scan pass).
# scan_method: websearch   → capped site: queries during discovery.
#
# Imported from companies_ats_boards_detected.csv where ATS boards were detected;
# remaining careers URLs are marked playwright.

title_filter:
  positive:
  - Software Engineer
  - Data Analyst
  - Product Manager
  - Project Manager
  - Business Analyst
  negative:
  - Junior
  - Intern
  - Trainee
  seniority_boost:
  - Senior
  - Staff
  - Principal
  - Lead
  - Head
  - Director
search_queries:
- name: Ashby — Software Engineer
  query: site:jobs.ashbyhq.com "Software Engineer" OR "Backend Engineer" remote
  enabled: false
- name: Ashby — Platform Engineer
  query: site:jobs.ashbyhq.com "Platform Engineer" OR "Infrastructure Engineer" remote
  enabled: false
- name: Greenhouse — SRE & DevOps
  query: site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Site Reliability Engineer" OR "DevOps"
    remote
  enabled: false
- name: Greenhouse — Platform Engineer
  query: site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Platform Engineer" OR "Infrastructure"
    remote
  enabled: false
- name: Workable — SRE & DevOps
  query: site:apply.workable.com "Site Reliability Engineer" OR "SRE" OR "DevOps" remote
  enabled: false
- name: Remotive — SRE/DevOps
  query: site:remotive.com "Site Reliability Engineer" OR "DevOps" OR "Platform Engineer"
  enabled: false
- name: WeWorkRemotely — SRE/DevOps
  query: site:weworkremotely.com "SRE" OR "DevOps" OR "Infrastructure" OR "Kubernetes"
  enabled: false
