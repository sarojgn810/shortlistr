# Portal Scanner Configuration
# Used by /shortlistr scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.mastercard.com   ⚠️ https://mastercard.wd1.myworkdayjobs.com (fallback only)
#   ✅ https://openai.com/careers       ⚠️ https://job-boards.greenhouse.io/openai (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  # Field-neutral defaults — match config._DEFAULT_SEARCH_KEYWORDS. A fresh clone
  # must not inherit the author's SRE/DevOps targeting; the user replaces these
  # in portals.yml after onboarding with their own role keywords.
  positive:
    - "Software Engineer"
    - "Data Analyst"
    - "Product Manager"
    - "Project Manager"
    - "Business Analyst"
  negative:
    - "Junior"
    - "Intern"
    - "Trainee"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Ashby --
  - name: Ashby — Software Engineer
    query: 'site:jobs.ashbyhq.com "Software Engineer" OR "Backend Engineer" remote'
    enabled: false

  - name: Ashby — Platform Engineer
    query: 'site:jobs.ashbyhq.com "Platform Engineer" OR "Infrastructure Engineer" remote'
    enabled: false

  # -- Greenhouse --
  - name: Greenhouse — SRE & DevOps
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Site Reliability Engineer" OR "DevOps" remote'
    enabled: false

  - name: Greenhouse — Platform Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Platform Engineer" OR "Infrastructure" remote'
    enabled: false

  # -- Workable --
  - name: Workable — SRE & DevOps
    query: 'site:apply.workable.com "Site Reliability Engineer" OR "SRE" OR "DevOps" remote'
    enabled: false

  # -- Remote-friendly boards --
  - name: Remotive — SRE/DevOps
    query: 'site:remotive.com "Site Reliability Engineer" OR "DevOps" OR "Platform Engineer"'
    enabled: false

  - name: WeWorkRemotely — SRE/DevOps
    query: 'site:weworkremotely.com "SRE" OR "DevOps" OR "Infrastructure" OR "Kubernetes"'
    enabled: false

