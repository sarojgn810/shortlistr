[pytest]
# `slow` is anything that shells out to a real LaTeX engine. Those tests are
# worth having — a real compile is what caught the "\rupee is undefined" bug
# that would have silently dropped every Indian candidate's resume back to the
# HTML renderer — but they take ~2 minutes of the suite's ~2.5.
#
#   make test        everything, including the compiles
#   make test-fast   skip them, for the inner loop
markers =
    slow: shells out to a real LaTeX engine (deselect with -m "not slow")
