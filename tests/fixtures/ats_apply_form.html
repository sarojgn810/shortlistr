<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fake ATS Apply Form</title>
</head>
<body>
  <h1>Apply — Example Corp</h1>
  <form id="application">
    <label>First Name <input id="first_name" name="first_name" /></label>
    <label>Last Name <input id="last_name" name="last_name" /></label>
    <label>Email <input id="email" name="email" type="email" /></label>
    <label>Phone <input id="phone" name="phone" type="tel" /></label>
    <label>LinkedIn <input id="linkedin" name="linkedin" /></label>
    <label>GitHub <input id="github" name="github" /></label>
    <label>Website / Portfolio <input id="website" name="website" /></label>
    <label>Current Location <input id="location" name="location" /></label>
    <label>Years of Experience <input id="years" name="years_experience" /></label>
    <label>Notice Period <input id="notice" name="notice_period" /></label>
    <label>Current CTC <input id="current_ctc" name="current_ctc" /></label>
    <label>Expected CTC <input id="expected_ctc" name="expected_ctc" /></label>
    <label>How did you hear about us? <input id="how_heard" name="source" /></label>
    <label>Work authorization <input id="work_auth" name="work_authorization" /></label>
    <label>Willing to relocate?
      <select id="relocate" name="relocate">
        <option value="">Select...</option>
        <option>Yes</option>
        <option>No</option>
        <option>Open to discussion</option>
      </select>
    </label>
    <label>Preferred name <input id="preferred_name" name="preferred_name" /></label>
    <label>Why are you interested in this role?
      <textarea id="cover" name="cover_letter" rows="4"></textarea>
    </label>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
